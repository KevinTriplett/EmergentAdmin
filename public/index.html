<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MN Host Automator</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #121418;
        --fg: #e8e8ec;
        --muted: #9aa0a6;
        --danger: #f87171;
        --ok: #4ade80;
        --panel: #1a1d24;
        --border: #2a2f3a;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        line-height: 1.45;
        padding: 1.25rem 1.5rem 2rem;
      }
      h1 {
        margin: 0 0 0.25rem;
        font-size: 1.5rem;
      }
      .subtitle {
        color: var(--muted);
        margin-bottom: 1.5rem;
      }
      section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 1rem 1.25rem;
        max-width: 52rem;
      }
      .sticky-abort {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--panel);
        padding-bottom: 0.75rem;
        margin: -0.25rem 0 0.75rem;
        border-bottom: 1px solid var(--border);
      }
      label,
      .row {
        display: block;
        margin-bottom: 0.65rem;
      }
      select {
        width: 100%;
        max-width: 28rem;
        padding: 0.4rem 0.5rem;
        border-radius: 4px;
        border: 1px solid var(--border);
        background: #0e1014;
        color: var(--fg);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        align-items: center;
        margin-top: 0.75rem;
      }
      button {
        cursor: pointer;
        border-radius: 4px;
        border: 1px solid var(--border);
        padding: 0.45rem 0.85rem;
        font-size: 0.95rem;
        background: #252a33;
        color: var(--fg);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      button.primary {
        background: #334155;
        border-color: #475569;
      }
      button.danger {
        background: #3f1d1d;
        border-color: #7f1d1d;
        color: #fecaca;
      }
      .dry-hint {
        color: var(--muted);
        font-size: 0.9rem;
        margin-left: 0.35rem;
      }
      .log-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 1.5rem 0 0.35rem;
      }
      .log-panel {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.8rem;
        height: 18rem;
        overflow-y: auto;
        background: #0a0b0e;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 0.5rem 0.65rem;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .log-line {
        margin: 0.1rem 0;
      }
      .log-line.errorish {
        color: var(--danger);
      }
      .log-line.would {
        color: var(--muted);
      }
      .log-line.removed {
        color: var(--ok);
      }
      .result-box {
        margin-top: 0.75rem;
        padding: 0.65rem 0.75rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #0e1014;
      }
      .result-box.error {
        border-color: #7f1d1d;
        color: #fecaca;
      }
      .ws-status {
        font-size: 0.85rem;
        color: var(--danger);
        margin-bottom: 0.35rem;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>MN Host Automator</h1>
      <p class="subtitle">Mighty Networks Space Management</p>
    </header>

    <section>
      <h2 style="margin-top: 0; font-size: 1.1rem">Remove Space Members</h2>

      <div id="ws-disconnect" class="ws-status" hidden>Disconnected</div>

      <div id="abort-wrap" class="sticky-abort" hidden>
        <button type="button" class="danger" id="btn-abort">Abort</button>
      </div>

      <label for="space-select">Space</label>
      <select id="space-select">
        <option>1. Relating to SELF</option>
        <option>2. Relating to OTHERS</option>
        <option>3. Relating to WORLD</option>
        <option>4. Current Events/Politics/Hot Buttons</option>
        <option>5. News/Ideas from Crews, Teams, Events</option>
        <option>6. Personal Introductions</option>
        <option>7. EC Announcements and Highlights</option>
        <option>8. Miscellaneous</option>
        <option>Creative Center</option>
        <option>Marketplace</option>
        <option>Playground</option>
      </select>

      <div class="row">
        <label><input type="checkbox" id="chk-headless" checked /> Headless mode</label>
      </div>
      <div class="row">
        <label
          ><input type="checkbox" id="chk-dry" checked /> Dry run
          <span id="dry-hint" class="dry-hint">(no members will be removed)</span></label
        >
      </div>

      <div class="actions">
        <button type="button" class="primary" id="btn-run">Remove All Non-Admin Members</button>
      </div>
    </section>

    <div class="log-header">
      <button type="button" id="btn-clear-log">Clear Log</button>
    </div>
    <div class="log-panel" id="log-panel" aria-live="polite"></div>
    <div id="result"></div>

    <script>
      (function () {
        const logPanel = document.getElementById('log-panel');
        const resultEl = document.getElementById('result');
        const btnRun = document.getElementById('btn-run');
        const btnAbort = document.getElementById('btn-abort');
        const btnClear = document.getElementById('btn-clear-log');
        const spaceSelect = document.getElementById('space-select');
        const chkHeadless = document.getElementById('chk-headless');
        const chkDry = document.getElementById('chk-dry');
        const dryHint = document.getElementById('dry-hint');
        const abortWrap = document.getElementById('abort-wrap');
        const wsDisconnect = document.getElementById('ws-disconnect');

        let ws = null;
        let reconnectTimer = null;
        let taskRunning = false;

        function setTaskRunning(running) {
          taskRunning = running;
          btnRun.disabled = running;
          abortWrap.hidden = !running;
          btnAbort.disabled = !running;
        }

        function appendLog(message) {
          const line = document.createElement('div');
          line.className = 'log-line';
          line.textContent = message;
          if (
            message.includes('ERROR') ||
            message.includes('STALE GUARD') ||
            message.includes('HALT')
          ) {
            line.classList.add('errorish');
          } else if (
            /^dry run: would remove/i.test(message) ||
            message.startsWith('WOULD REMOVE')
          ) {
            line.classList.add('would');
          } else if (/^removal \d+ complete:/i.test(message) || message.startsWith('Removed')) {
            line.classList.add('removed');
          }
          logPanel.appendChild(line);
          logPanel.scrollTop = logPanel.scrollHeight;
        }

        function clearResult() {
          resultEl.innerHTML = '';
        }

        function showResult(html, isError) {
          const box = document.createElement('div');
          box.className = 'result-box' + (isError ? ' error' : '');
          box.innerHTML = html;
          resultEl.appendChild(box);
        }

        chkDry.addEventListener('change', function () {
          dryHint.hidden = !chkDry.checked;
        });
        dryHint.hidden = !chkDry.checked;

        btnClear.addEventListener('click', function () {
          logPanel.innerHTML = '';
          clearResult();
        });

        function connectWs() {
          if (reconnectTimer) {
            clearTimeout(reconnectTimer);
            reconnectTimer = null;
          }
          wsDisconnect.hidden = true;
          ws = new WebSocket('ws://' + location.host);

          ws.addEventListener('message', function (ev) {
            try {
              const msg = JSON.parse(ev.data);
              if (msg.type === 'log') {
                appendLog(msg.message);
              } else if (msg.type === 'done') {
                setTaskRunning(false);
                showResult('<strong>Done.</strong><pre>' + JSON.stringify(msg.result, null, 2) + '</pre>', false);
              } else if (msg.type === 'error') {
                setTaskRunning(false);
                showResult('<strong>Error</strong><p>' + escapeHtml(msg.message) + '</p>', true);
              }
            } catch {
              appendLog(ev.data);
            }
          });

          ws.addEventListener('close', function () {
            wsDisconnect.hidden = false;
            reconnectTimer = setTimeout(connectWs, 3000);
          });
        }

        function escapeHtml(s) {
          return String(s)
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
        }

        btnAbort.addEventListener('click', function () {
          if (ws && ws.readyState === WebSocket.OPEN) {
            ws.send(JSON.stringify({ type: 'abort' }));
          }
        });

        btnRun.addEventListener('click', async function () {
          clearResult();
          setTaskRunning(true);
          try {
            const res = await fetch('/run/remove-space-members', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                fullSpaceName: spaceSelect.value,
                headless: chkHeadless.checked,
                dryRun: chkDry.checked,
              }),
            });
            const body = await res.json().catch(function () {
              return {};
            });
            if (res.status === 409) {
              appendLog('ERROR: ' + (body.error || res.statusText));
              setTaskRunning(false);
              return;
            }
            if (!res.ok) {
              appendLog('ERROR: ' + (body.error || res.statusText));
              setTaskRunning(false);
              showResult('<strong>HTTP ' + res.status + '</strong><pre>' + escapeHtml(JSON.stringify(body, null, 2)) + '</pre>', true);
              return;
            }
            /* Final summary comes from WebSocket { type: "done" }; re-enable if WS missed. */
            setTaskRunning(false);
          } catch (e) {
            appendLog('ERROR: ' + (e && e.message ? e.message : String(e)));
            setTaskRunning(false);
          }
        });

        connectWs();
      })();
    </script>
  </body>
</html>
